<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="dbms.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="https://i.pinimg.com/1200x/af/85/fd/af85fd005cb098111b85832faf17f00f.jpg" alt="School Logo">
        </div>

        <h1>School Management System</h1>

        <nav>
            <ul>

                <li class="dropdown">
                    Student
                    <ul class="dropdown-content">
                        <li><a href="add_student.html">Add Student</a></li>
                        <li><a href="edit_student.html">Edit Student</a></li>
                        <li><a href="delete_student.html">Delete Student</a></li>
                    </ul>
                </li>

                <li class="dropdown">
                    Marks
                    <ul class="dropdown-content">
                        <li><a href="enter_marks.html">Enter Marks</a></li>
                        <li><a href="edit_marks.html">Edit Marks</a></li>
                        <li><a href="delete_marks.html">Delete Marks</a></li>
                    </ul>
                </li>

                <li class="dropdown">
                    Attendance
                    <ul class="dropdown-content">
                        <li><a href="add_attendance.html">Add Attendance</a></li>
                        <li><a href="edit_attendance.html">Edit Attendance</a></li>
                        <li><a href="delete_attendance.html">Delete Attendance</a></li>
                    </ul>
                </li>

                <li>
                    <a href="reports_html.html">Reports</a>
                </li>

                <li onclick="logout()">Exit</li>

            </ul>
        </nav>

    </header>

    <div class="container">

        <h2>ADD NEW STUDENT</h2>

        <form id="studentForm">

            <label for="regno">Registration Number</label>
            <input type="text" id="regno" required>

            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>

            <label for="age">Age</label>
            <input type="number" id="age" required>

            <label for="gender">Gender</label>
            <select id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="className">Class</label>
            <input type="text" id="className" required>

            <label for="address">Address</label>
            <textarea id="address" rows="3"></textarea>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <button type="submit">Save Student</button>

        </form>

    </div>

    <script>

        document.getElementById("studentForm").addEventListener("submit", function(e){

            e.preventDefault();

            let student = {

                regno: document.getElementById("regno").value,
                name: document.getElementById("name").value,
                dob: document.getElementById("dob").value,
                age: document.getElementById("age").value,
                gender: document.getElementById("gender").value,
                className: document.getElementById("className").value,
                address: document.getElementById("address").value,
                phone: document.getElementById("phone").value,
                email: document.getElementById("email").value

            };

            let students = JSON.parse(localStorage.getItem("students")) || [];

            let exists = students.find(s => s.regno === student.regno);

            if(exists){

                alert("Registration Number already exists!");
                return;

            }

            students.push(student);

            localStorage.setItem("students", JSON.stringify(students));

            alert("Student Added Successfully!");

            this.reset();

        });

        function logout(){

            if(confirm("Do you want to exit?")){

                window.location.href = "dbms.home.html";

            }

        }

    </script>

</body>

</html>
