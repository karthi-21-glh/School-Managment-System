<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Marks</title>
    <link rel="stylesheet" href="dbms.css">
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            alert("Access Restricted! Please log in first.");
            window.location.href = "index.html";
        }
    </script>
</head>

<body>

<header>

    <div class="logo">
        <img src="https://i.pinimg.com/1200x/af/85/fd/af85fd005cb098111b85832faf17f00f.jpg" alt="School Logo">
    </div>

    <h1>School Management System</h1>

    <nav>
        <ul>

            <li><a href="dbms_home.html">Home</a></li>

            <li class="dropdown">
                Student
                <ul class="dropdown-content">
                    <li><a href="add_student.html">Add Student</a></li>
                    <li><a href="edit_student.html">Edit Student</a></li>
                    <li><a href="delete_student.html">Delete Student</a></li>
                </ul>
            </li>

            <li class="dropdown">
                Marks
                <ul class="dropdown-content">
                    <li><a href="enter_marks.html">Enter Marks</a></li>
                    <li><a href="edit_marks.html">Edit Marks</a></li>
                    <li><a href="delete_marks.html">Delete Marks</a></li>
                </ul>
            </li>

            <li class="dropdown">
                Attendance
                <ul class="dropdown-content">
                    <li><a href="add_attendance.html">Add Attendance</a></li>
                    <li><a href="edit_attendance.html">Edit Attendance</a></li>
                    <li><a href="delete_attendance.html">Delete Attendance</a></li>
                </ul>
            </li>

            <li>
                <a href="reports_html.html">Reports</a>
            </li>

            <li onclick="logout()">Exit</li>

        </ul>
    </nav>

</header>

<div class="container">

    <h2>EDIT MARKS</h2>

    <form id="editMarksForm">

        <label>Registration Number</label>
        <input type="text" id="regno" required>

        <label>Exam</label>

        <select id="exam">
            <option>Class Test 1</option>
            <option>Class Test 2</option>
            <option>Mid Term</option>
            <option>Half Yearly</option>
            <option>Final Exam</option>
        </select>

        <button type="button" onclick="getMarks()">Get Marks</button>

        <label>First Language</label>
        <input type="number" id="firstLanguage" min="0" max="100">

        <label>Second Language</label>
        <input type="number" id="secondLanguage" min="0" max="100">

        <label>Mathematics</label>
        <input type="number" id="maths" min="0" max="100">

        <label>Science</label>
        <input type="number" id="science" min="0" max="100">

        <label>Arts</label>
        <input type="number" id="arts" min="0" max="100">

        <label>Other (if any)</label>
        <input type="number" id="other" min="0" max="100">

        <button type="submit">Save Changes</button>

    </form>

</div>

<script>

function getMarks(){

    let regno = document.getElementById("regno").value;
    let exam = document.getElementById("exam").value;

    let marks = JSON.parse(localStorage.getItem("marks")) || [];

    let mark = marks.find(m => m.regno === regno && m.exam === exam);

    if(!mark){

        alert("Marks not found!");
        return;

    }

    document.getElementById("firstLanguage").value = mark.firstlanguage || mark.firstLanguage || 0;
    document.getElementById("secondLanguage").value = mark.secondlanguage || mark.secondLanguage || 0;
    document.getElementById("maths").value = mark.maths || 0;
    document.getElementById("science").value = mark.science || 0;
    document.getElementById("arts").value = mark.arts || 0;
    document.getElementById("other").value = mark.other || 0;

}

document.getElementById("editMarksForm").addEventListener("submit", function(e){

    e.preventDefault();

    let regno = document.getElementById("regno").value;
    let exam = document.getElementById("exam").value;

    let marks = JSON.parse(localStorage.getItem("marks")) || [];

    let index = marks.findIndex(m => m.regno === regno && m.exam === exam);

    if(index === -1){

        alert("Marks not found!");
        return;

    }

    marks[index].firstlanguage = document.getElementById("firstLanguage").value;
    marks[index].secondlanguage = document.getElementById("secondLanguage").value;
    marks[index].firstLanguage = document.getElementById("firstLanguage").value;
    marks[index].secondLanguage = document.getElementById("secondLanguage").value;
    marks[index].maths = document.getElementById("maths").value;
    marks[index].science = document.getElementById("science").value;
    marks[index].arts = document.getElementById("arts").value;
    marks[index].other = document.getElementById("other").value;

    localStorage.setItem("marks", JSON.stringify(marks));

    alert("Marks Updated Successfully!");

    document.getElementById("editMarksForm").reset();

});

function logout(){

    if(confirm("Do you want to exit?")){

        sessionStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";

    }

}

</script>

</body>
</html>
