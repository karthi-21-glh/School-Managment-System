<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
    <link rel="stylesheet" href="dbms.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="https://i.pinimg.com/1200x/af/85/fd/af85fd005cb098111b85832faf17f00f.jpg" alt="School Logo">
    </div>

    <h1>School Management System</h1>

    <nav>
        <ul>

            <li class="dropdown">
                Student
                <ul class="dropdown-content">
                    <li><a href="add_student.html">Add Student</a></li>
                    <li><a href="edit_student.html">Edit Student</a></li>
                    <li><a href="delete_student.html">Delete Student</a></li>
                </ul>
            </li>

            <li class="dropdown">
                Marks
                <ul class="dropdown-content">
                    <li><a href="enter_marks.html">Enter Marks</a></li>
                    <li><a href="edit_marks.html">Edit Marks</a></li>
                    <li><a href="delete_marks.html">Delete Marks</a></li>
                </ul>
            </li>

            <li class="dropdown">
                Attendance
                <ul class="dropdown-content">
                    <li><a href="add_attendance.html">Add Attendance</a></li>
                    <li><a href="edit_attendance.html">Edit Attendance</a></li>
                    <li><a href="delete_attendance.html">Delete Attendance</a></li>
                </ul>
            </li>

            <li>
                <a href="reports_html.html">Reports</a>
            </li>

            <li onclick="logout()">Exit</li>

        </ul>
    </nav>

</header>

<div class="container">

    <h2>DELETE STUDENT</h2>

    <label for="regno">Registration Number</label>

    <div class="search-box">
        <input type="text" id="regno">
        <button type="button" onclick="searchStudent()">Search</button>
    </div>

    <form id="deleteForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" readonly>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" readonly>

        <label for="age">Age</label>
        <input type="number" id="age" readonly>

        <label for="gender">Gender</label>
        <input type="text" id="gender" readonly>

        <label for="className">Class</label>
        <input type="text" id="className" readonly>

        <label for="address">Address</label>
        <textarea id="address" rows="3" readonly></textarea>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" readonly>

        <label for="email">Email Address</label>
        <input type="email" id="email" readonly>

        <button type="submit">Delete Student</button>

    </form>

</div>

<script>

function searchStudent(){

    let regno = document.getElementById("regno").value;

    let students = JSON.parse(localStorage.getItem("students")) || [];

    let student = students.find(s => s.regno === regno);

    if(!student){

        alert("Student not found!");
        return;

    }

    document.getElementById("name").value = student.name;
    document.getElementById("dob").value = student.dob;
    document.getElementById("age").value = student.age;
    document.getElementById("gender").value = student.gender;
    document.getElementById("className").value = student.className;
    document.getElementById("address").value = student.address;
    document.getElementById("phone").value = student.phone;
    document.getElementById("email").value = student.email;

}

document.getElementById("deleteForm").addEventListener("submit", function(e){

    e.preventDefault();

    if(!confirm("Are you sure you want to delete this student?")){

        return;

    }

    let regno = document.getElementById("regno").value;

    let students = JSON.parse(localStorage.getItem("students")) || [];

    students = students.filter(s => s.regno !== regno);

    localStorage.setItem("students", JSON.stringify(students));

    alert("Student Deleted Successfully!");

    document.getElementById("deleteForm").reset();
    document.getElementById("regno").value = "";

});

function logout(){

    if(confirm("Do you want to exit?")){

        window.location.href = "dbms.home.html";

    }

}

</script>

</body>

</html>
