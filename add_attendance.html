<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Attendance</title>
    <link rel="stylesheet" href="dbms.css" />
    <script>
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        alert("Access Restricted! Please log in first.");
        window.location.href = "index.html";
      }
    </script>
  </head>

  <body>
    <header>
      <div class="logo">
        <img
          src="https://i.pinimg.com/1200x/af/85/fd/af85fd005cb098111b85832faf17f00f.jpg"
          alt="School Logo"
        />
      </div>

      <h1>School Management System</h1>

      <nav>
        <ul>
          <li><a href="dbms_home.html">Home</a></li>

          <li class="dropdown">
            Student
            <ul class="dropdown-content">
              <li><a href="add_student.html">Add Student</a></li>
              <li><a href="edit_student.html">Edit Student</a></li>
              <li><a href="delete_student.html">Delete Student</a></li>
            </ul>
          </li>

          <li class="dropdown">
            Marks
            <ul class="dropdown-content">
              <li><a href="enter_marks.html">Enter Marks</a></li>
              <li><a href="edit_marks.html">Edit Marks</a></li>
              <li><a href="delete_marks.html">Delete Marks</a></li>
            </ul>
          </li>

          <li class="dropdown">
            Attendance
            <ul class="dropdown-content">
              <li><a href="add_attendance.html">Add Attendance</a></li>
              <li><a href="edit_attendance.html">Edit Attendance</a></li>
              <li><a href="delete_attendance.html">Delete Attendance</a></li>
            </ul>
          </li>

          <li>
            <a href="reports.html">Reports</a>
          </li>

          <li onclick="logout()">Exit</li>
        </ul>
      </nav>
    </header>

    <div class="container">
      <h2>ADD ATTENDANCE</h2>

      <form id="attendanceForm">
        <label>Registration Number</label>
        <input type="text" id="regno" placeholder="Enter registration number" />

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name" />

        <label>Date</label>
        <input type="date" id="date" required />

        <label>Status</label>
        <select id="status" required>
          <option value="">Select</option>
          <option>Present</option>
          <option>Absent</option>
        </select>

        <button type="submit">Save Attendance</button>
      </form>
    </div>

    <script>
      let selectedStudent = null;

      async function findStudent() {
        const regno = document.getElementById("regno").value.trim();
        const name = document.getElementById("name").value.trim();

        // At least one of the two must be entered
        if (!regno && !name) {
          alert("Please enter either Registration Number or Student Name.");
          return null;
        }

        try {
          let student = null;

          // --------------------------------
          // OPTION 1: Search by Registration Number
          // --------------------------------
          if (regno) {
            const response = await fetch(
              `http://localhost:5000/api/students/${encodeURIComponent(regno)}`,
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.error || data.message || "Student not found",
              );
            }

            student = data;
          }

          // --------------------------------
          // OPTION 2: Search by Student Name
          // --------------------------------
          else if (name) {
            const response = await fetch("http://localhost:5000/api/students");

            const students = await response.json();

            if (!response.ok || !Array.isArray(students)) {
              throw new Error("Unable to retrieve students.");
            }

            const matches = students.filter(
              (s) =>
                s.full_name && s.full_name.toLowerCase() === name.toLowerCase(),
            );

            if (matches.length === 0) {
              throw new Error("Student with this name was not found.");
            }

            if (matches.length > 1) {
              alert(
                "Multiple students have this name. Please use the Registration Number.",
              );
              return null;
            }

            student = matches[0];
          }

          // --------------------------------
          // Student found
          // --------------------------------

          selectedStudent = student;

          // Fill both fields
          document.getElementById("regno").value = student.reg_no || "";

          document.getElementById("name").value = student.full_name || "";

          return student;
        } catch (error) {
          console.error("Error finding student:", error);

          alert("Failed to find student: " + error.message);

          selectedStudent = null;

          return null;
        }
      }

      document
        .getElementById("attendanceForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const attendance_date = document.getElementById("date").value;

          const status = document.getElementById("status").value;

          if (!attendance_date || !status) {
            alert("Please fill in the Date and Status.");
            return;
          }

          // Find the student using either field
          const student = await findStudent();

          if (!student) {
            return;
          }

          const attendance = {
            reg_no: student.reg_no,

            attendance_date: attendance_date,

            status: status,
          };

          try {
            const response = await fetch(
              "http://localhost:5000/api/attendance",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                },

                body: JSON.stringify(attendance),
              },
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.error || data.message || "Failed to save attendance",
              );
            }

            alert("Attendance Added Successfully!");

            this.reset();

            selectedStudent = null;
          } catch (error) {
            console.error("Error adding attendance:", error);

            alert("Failed to add attendance: " + error.message);
          }
        });

      function logout() {
        if (confirm("Do you want to exit?")) {
          sessionStorage.removeItem("isLoggedIn");

          window.location.href = "index.html";
        }
      }
    </script>
  </body>
</html>
