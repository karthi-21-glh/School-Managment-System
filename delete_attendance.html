<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Attendance</title>
    <link rel="stylesheet" href="dbms.css" />
    <script>
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        alert("Access Restricted! Please log in first.");
        window.location.href = "index.html";
      }
    </script>
  </head>

  <body>
    <header>
      <div class="logo">
        <img
          src="https://i.pinimg.com/1200x/af/85/fd/af85fd005cb098111b85832faf17f00f.jpg"
          alt="School Logo"
        />
      </div>

      <h1>School Management System</h1>

      <nav>
        <ul>
          <li><a href="dbms_home.html">Home</a></li>

          <li class="dropdown">
            Student
            <ul class="dropdown-content">
              <li><a href="add_student.html">Add Student</a></li>
              <li><a href="edit_student.html">Edit Student</a></li>
              <li><a href="delete_student.html">Delete Student</a></li>
            </ul>
          </li>

          <li class="dropdown">
            Marks
            <ul class="dropdown-content">
              <li><a href="enter_marks.html">Enter Marks</a></li>
              <li><a href="edit_marks.html">Edit Marks</a></li>
              <li><a href="delete_marks.html">Delete Marks</a></li>
            </ul>
          </li>

          <li class="dropdown">
            Attendance
            <ul class="dropdown-content">
              <li><a href="add_attendance.html">Add Attendance</a></li>
              <li><a href="edit_attendance.html">Edit Attendance</a></li>
              <li><a href="delete_attendance.html">Delete Attendance</a></li>
            </ul>
          </li>

          <li>
            <a href="reports.html">Reports</a>
          </li>

          <li onclick="logout()">Exit</li>
        </ul>
      </nav>
    </header>

    <div class="container">
      <h2>DELETE ATTENDANCE</h2>

      <form id="deleteForm">
        <label>Registration Number</label>
        <input type="text" id="regno" required />

        <label>Date</label>
        <input type="date" id="date" required />

        <button type="submit">Delete Attendance</button>
      </form>
    </div>

    <script>
      let currentAttendanceId = null;

      document
        .getElementById("deleteForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const regno = document.getElementById("regno").value.trim();

          const date = document.getElementById("date").value;

          if (!regno || !date) {
            alert("Please enter Registration Number and Date.");
            return;
          }

          try {
            // Get all attendance records for this student
            const response = await fetch(
              `http://localhost:5000/api/attendance/${encodeURIComponent(regno)}`,
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.error || data.message || "Failed to retrieve attendance",
              );
            }

            if (!Array.isArray(data)) {
              throw new Error("Invalid attendance data received.");
            }

            // Find the attendance record for the selected date
            const record = data.find((attendance) => {
              if (!attendance.attendance_date) {
                return false;
              }

              const attendanceDate = new Date(
                attendance.attendance_date,
              ).toLocaleDateString("en-CA", {
                timeZone: "Asia/Kolkata",
              });

              return attendanceDate === date;
            });

            if (!record) {
              alert("Attendance record not found.");
              return;
            }

            // Store the database ID
            currentAttendanceId = record.attend_id;

            // Ask for confirmation
            if (
              !confirm(
                "Are you sure you want to delete this attendance record?",
              )
            ) {
              currentAttendanceId = null;
              return;
            }

            // Delete from PostgreSQL
            const deleteResponse = await fetch(
              `http://localhost:5000/api/attendance/${currentAttendanceId}`,
              {
                method: "DELETE",
              },
            );

            const deleteData = await deleteResponse.json();

            if (!deleteResponse.ok) {
              throw new Error(
                deleteData.error ||
                  deleteData.message ||
                  "Failed to delete attendance",
              );
            }

            alert("Attendance Deleted Successfully!");

            this.reset();

            currentAttendanceId = null;
          } catch (error) {
            console.error("Error deleting attendance:", error);

            alert("Failed to delete attendance: " + error.message);
          }
        });

      function logout() {
        if (confirm("Do you want to exit?")) {
          sessionStorage.removeItem("isLoggedIn");

          window.location.href = "index.html";
        }
      }
    </script>
  </body>
</html>
