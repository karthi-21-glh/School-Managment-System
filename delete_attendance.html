<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Attendance</title>
    <link rel="stylesheet" href="dbms.css">
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            alert("Access Restricted! Please log in first.");
            window.location.href = "index.html";
        }
    </script>
</head>

<body>

<header>

    <div class="logo">
        <img src="https://i.pinimg.com/1200x/af/85/fd/af85fd005cb098111b85832faf17f00f.jpg" alt="School Logo">
    </div>

    <h1>School Management System</h1>

    <nav>
        <ul>

            <li><a href="dbms_home.html">Home</a></li>

            <li class="dropdown">
                Student
                <ul class="dropdown-content">
                    <li><a href="add_student.html">Add Student</a></li>
                    <li><a href="edit_student.html">Edit Student</a></li>
                    <li><a href="delete_student.html">Delete Student</a></li>
                </ul>
            </li>

            <li class="dropdown">
                Marks
                <ul class="dropdown-content">
                    <li><a href="enter_marks.html">Enter Marks</a></li>
                    <li><a href="edit_marks.html">Edit Marks</a></li>
                    <li><a href="delete_marks.html">Delete Marks</a></li>
                </ul>
            </li>

            <li class="dropdown">
                Attendance
                <ul class="dropdown-content">
                    <li><a href="add_attendance.html">Add Attendance</a></li>
                    <li><a href="edit_attendance.html">Edit Attendance</a></li>
                    <li><a href="delete_attendance.html">Delete Attendance</a></li>
                </ul>
            </li>

            <li>
                <a href="reports_html.html">Reports</a>
            </li>

            <li onclick="logout()">Exit</li>

        </ul>
    </nav>

</header>

<div class="container">

    <h2>DELETE ATTENDANCE</h2>

    <form id="deleteForm">

        <label>Registration Number</label>
        <input type="text" id="regno" required>

        <label>Date</label>
        <input type="date" id="date" required>

        <button type="submit">Delete Attendance</button>

    </form>

</div>

<script>

document.getElementById("deleteForm").addEventListener("submit", function(e){

    e.preventDefault();

    let regno = document.getElementById("regno").value;
    let date = document.getElementById("date").value;

    let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

    let index = attendance.findIndex(a =>
        a.regno === regno &&
        a.date === date
    );

    if(index === -1){

        alert("Attendance record not found!");
        return;

    }

    if(confirm("Are you sure you want to delete this attendance record?")){

        attendance.splice(index, 1);

        localStorage.setItem("attendance", JSON.stringify(attendance));

        alert("Attendance Deleted Successfully!");

        this.reset();

    }

});

function logout(){

    if(confirm("Do you want to exit?")){

        sessionStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";

    }

}

</script>

</body>

</html>
